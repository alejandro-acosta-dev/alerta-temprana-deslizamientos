# Configuración de la API. Los valores sensibles NO se escriben aquí: se leen de
# variables de entorno (o del archivo .env, que no se sube a Git). Los nombres
# de las variables están en .env.example y en la Vista de Despliegue (DAS 3.5).
spring:
  application:
    name: alerta-temprana-deslizamientos

  # Si existe un archivo .env en la carpeta desde donde se arranca la API,
  # sus líneas CLAVE=valor se cargan como propiedades. Si no existe, se ignora.
  config:
    import: optional:file:.env[.properties]

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME}
    username: ${DB_USER}
    password: ${DB_PASSWORD}

  # Flyway es quien crea y cambia las tablas (db/migrations). Hibernate solo las usa.
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: filesystem:db/migrations

server:
  port: ${SERVER_PORT:8080}

# Solo se expone /actuator/health y sin detalles (solo UP o DOWN).
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
